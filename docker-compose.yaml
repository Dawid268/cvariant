services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: cvariant
      POSTGRES_PASSWORD: cvariant
      POSTGRES_DB: cvariant
    ports:
      - "127.0.0.1:5442:5432" # 5442 on the host, so it does not clash with other local Postgres instances
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvariant -d cvariant"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
      - ./migrations:/app/migrations
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  db-data:
